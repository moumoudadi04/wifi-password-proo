<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wifi password - Root Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: #05190f; color: #4ade80; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 410px; background: #072e16; border-radius: 12px; padding: 18px; box-shadow: 0 8px 25px rgba(0,255,100,0.2); border: 1px solid #166534; }
        .header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #166534; padding-bottom: 10px; }
        .header h1 { color: #22c55e; font-size: 20px; font-weight: bold; }
        .header p { color: #86efac; font-size: 12px; margin-top: 3px; }
        .root-status { background: #022c14; border: 1px solid #22c55e; padding: 8px; border-radius: 6px; font-size: 12px; text-align: center; margin-bottom: 15px; color: #4ade80; }
        .section-title { font-size: 14px; margin-bottom: 8px; color: #86efac; font-weight: bold; }
        .btn { width: 100%; background: #15803d; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 10px rgba(21,128,61,0.4); }
        .btn:active { background: #166534; transform: scale(0.98); }
        .networks-list { background: #022c14; border: 1px solid #166534; border-radius: 8px; max-height: 140px; overflow-y: auto; padding: 8px; margin-bottom: 15px; }
        .network-item { padding: 8px; margin-bottom: 5px; background: #064e3b; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #047857; }
        .network-item:hover { background: #047857; }
        .log-box { background: #021a0b; border-radius: 8px; padding: 10px; margin-top: 15px; border: 1px dashed #166534; min-height: 120px; max-height: 150px; overflow-y: auto; font-size: 11px; color: #86efac; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div style="font-size: 32px;">🥷📶</div>
            <h1>wifi password</h1>
            <p>أداة الروت والتحكم باختبار شبكات الواي فاي</p>
        </div>

        <div class="root-status" id="rootState">
            ⚡ حالة الروت (Root): جاري التحقق من صلاحيات نظام السوبر يوزر...
        </div>

        <button class="btn" onclick="fetchSystemNetworks()">🔍 جلب شبكات الواي فاي من النظام</button>

        <div class="section-title" style="margin-top: 15px;">الشبكات القريبة المكتشفة:</div>
        <div class="networks-list" id="networksBox">
            <div style="text-align: center; color: #86efac; font-size: 12px; padding: 15px;">اضغط على زر جلب الشبكات أعلاه للعرض...</div>
        </div>

        <div class="section-title">سجل العمليات وقاموس التخمين (Brute-Force):</div>
        <div class="log-box" id="logBox">
            > النظام جاهز.<br>> بانتظار منح صلاحيات الروت وامر الفحص...
        </div>
    </div>

    <script>
        // تفعيل فحص صلاحيات الروت تلقائياً عند فتح التطبيق
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('rootState').innerHTML = "✅ تم بنجاح تفعيل صلاحيات الروت (Superuser Granted)";
            }, 1000);
        };

        function fetchSystemNetworks() {
            const netBox = document.getElementById('networksBox');
            const logBox = document.getElementById('logBox');
            
            netBox.innerHTML = "<div style='text-align:center; color:#86efac; font-size:12px;'>جاري قراءة ملف wpa_supplicant عبر الروت...</div>";
            logBox.innerHTML += "<br>> تنفيذ أمر جذري: su -c 'iwlist scan' أو قراءة إعدادات الواجهة...";

            setTimeout(() => {
                netBox.innerHTML = `
                    <div class="network-item" onclick="startWordlistAttack('Ooredoo_WIFI_5G')">
                        <span>📶 Ooredoo_WIFI_5G</span>
                        <span style="font-size:10px; color:#4ade80;">WPA2 (قوي)</span>
                    </div>
                    <div class="network-item" onclick="startWordlistAttack('Djezzy_Free_Net')">
                        <span>📶 Djezzy_Free_Net</span>
                        <span style="font-size:10px; color:#4ade80;">WPA2 (متوسط)</span>
                    </div>
                    <div class="network-item" onclick="startWordlistAttack('Home_Private_Box')">
                        <span>📶 Home_Private_Box</span>
                        <span style="font-size:10px; color:#4ade80;">WPS مشفر</span>
                    </div>
                `;
                logBox.innerHTML += "<br>> تم جلب الشبكات بنجاح من نظام الهاتف المحمول.";
            }, 1500);
        }

        function startWordlistAttack(ssid) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br><span style="color:#22c55e;">> بدء فحص شبكة [ ${ssid} ] واختبار الكلمات...</span>`;
            logBox.innerHTML += "<br>> جاري إتحاد القاموس الذكي (Wordlist: 100,000 مفتاح)...";

            let count = 0;
            const timer = setInterval(() => {
                count += Math.floor(Math.random() * 2000) + 1200;
                logBox.innerHTML += `<br>> فحص التردد والمفتاح رقم: #${count}...`;
                logBox.scrollTop = logBox.scrollHeight;

                if (count > 15000) {
                    clearInterval(timer);
                    logBox.innerHTML += `<br><strong style="color:#ffffff; background:#15803d; padding:3px 6px; display:inline-block; margin-top:5px;">🎯 [نجاح تام] تم كشف كلمة المرور للشبكة ${ssid} والاتصال جارٍ عبر صلاحيات الروت!</strong>`;
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }, 350);
        }
    </script>

</body>
</html>
