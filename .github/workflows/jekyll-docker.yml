name: Jekyll and APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create site directory with proper permissions
      run: |
        mkdir -p _site
        sudo chmod -R 777 _site

    - name: Build the site in the jekyll/builder container
      run: |
        docker run --rm \
        -v ${{ github.workspace }}:/srv/jekyll \
        -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest \
        bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies & Build Web Assets
      run: |
        npm install
        npm run build

    - name: Init Capacitor Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact (Download Button)
      uses: actions/upload-artifact@v4
      with:
        name: wifi-password-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
